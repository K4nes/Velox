[package]
name = "velox"
# Cargo requires a version. The shipped version comes from tauri.conf.json
# > version, which reads ../package.json.
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
