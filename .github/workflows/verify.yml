name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # The installer build and the browser suite are both verified on Windows,
    # so the job runs there rather than on a Linux runner it has never seen.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The repo's own gates, in the order AGENTS.md documents them.
      - run: npm run build

      # `tauri::generate_context!` embeds `dist/`, so the Rust steps run after
      # the build above. The toolchain is pinned: a floating stable could turn
      # `-D warnings` red without a code change.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - run: npm run lint

      # Three things that used to drift by hand: the command table, the commit
      # subject format, and a version literal typed into `src/`.
      - run: node scripts/check-command-table.mjs
      - run: node scripts/check-version-literal.mjs
      - name: commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-subject.mjs

      # Deliberately no E2E_* secrets. The mocked lane has to pass without
      # them, and a test that quietly needs one fails here instead of on a
      # maintainer's machine.
      - run: npx e2e run
