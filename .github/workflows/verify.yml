name: verify

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A new commit on a pull request makes the previous run's answer stale. Main
# keeps every run, because each merged commit is a release candidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # The installer build and the browser suite are both verified on Windows,
    # so the job runs there rather than on a Linux runner it has never seen.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commit-message.mjs

      # The repo's own gates, in the order AGENTS.md documents them.
      - run: npm run build
      - run: npm run typecheck:test

      # `tauri::generate_context!` embeds `dist/`, so the Rust steps run after
      # the build above. The toolchain is pinned: a floating stable could turn
      # `-D warnings` red without a code change. The manifest sits in
      # `src-tauri`, so the cache root is named or it finds no Cargo.lock.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - run: npm run lint

      # Six things that used to drift by hand: the command table, a version
      # literal typed into `src/`, the lock against the manifest, the commit
      # subject format, a secret placed where every step can read it, and a
      # line wider than the 80 columns the other workflows keep.
      - run: node scripts/check-command-table.mjs
      - run: node scripts/check-version-literal.mjs
      - run: node scripts/check-collection-label.mjs
      - run: node scripts/check-lockfile.mjs
      - run: node scripts/check-workflow-secrets.mjs
      - run: node scripts/check-workflow-width.mjs
      - name: commit subject
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-subject.mjs

      # The release manifest and signature logic. It needs no window and no
      # network, so it runs beside the gates above.
      - run: npm run test:release

  browser:
    # The mocked lane starts its own Vite server, so it needs neither the Rust
    # toolchain nor `dist`. A second job runs it beside `verify` instead of
    # after four minutes of Rust compile.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The runner downloads a missing Chromium before the suite's clock
      # starts. The cache keeps that download out of every run.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx @e2e-dev/web install chromium

      # Deliberately no E2E_* secrets. The mocked lane has to pass without
      # them, and a test that quietly needs one fails here instead of on a
      # maintainer's machine.
      # Four workers match the runner's four cores; six oversubscribed them
      # and made the longest file slower. Zero retries keep a flaky test red.
      - run: npx e2e run --workers 4 --retries 0

      # A trace and a JUnit report are written on failure. Without this step
      # the job would discard the only evidence of what went wrong.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/results
          if-no-files-found: warn
          retention-days: 7
